name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Use canonical WebApp launcher icon
        run: |
          ICON_URL="https://www.sachyhoc.com/wp-content/plugins/medipharm-clinical-suite/assets/icons/icon-512.png"
          curl -fL --retry 3 --retry-delay 2 "$ICON_URL" -o /tmp/app_icon.png
          echo "0c254428890f6daf86852b85e9b72ea743c5fc533101e5c170e26401c65d6940  /tmp/app_icon.png" | sha256sum -c -
          rm -f app/src/main/res/drawable/app_icon.xml app/src/main/res/drawable/app_icon.webp app/src/main/res/drawable/app_icon.png
          cp /tmp/app_icon.png app/src/main/res/drawable/app_icon.png

      - name: Build and align release APK
        run: |
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n1)
          test -n "$VERSION_NAME"
          gradle --no-daemon assembleRelease
          mkdir -p out
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "out/MEDIPHARM-Clinical-Suite-v${VERSION_NAME}-aligned-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "out/MEDIPHARM-Clinical-Suite-v${VERSION_NAME}-aligned-unsigned.apk"
          sha256sum "out/MEDIPHARM-Clinical-Suite-v${VERSION_NAME}-aligned-unsigned.apk" > "out/MEDIPHARM-Clinical-Suite-v${VERSION_NAME}-aligned-unsigned.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: medipharm-clinical-suite-android-build
          path: out/
          if-no-files-found: error
          retention-days: 7
