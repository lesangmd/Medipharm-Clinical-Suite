name: Build Android v1.1.3 Interaction Deadlock Hotfix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SOURCE_SHA256: 8e7fea8c200c7f63c3390241f801c94b49808fb00c2e94810a10468649a428d7
      SOURCE_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-44e4-8209-bb9b-ec7a4966421f/raw?se=2026-09-30T00%3A03%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=7189a92e-7a86-5556-97c6-0edaa51564bc&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T22%3A19%3A50Z&ske=2026-09-30T22%3A19%3A50Z&sks=b&skv=2026-02-06&sig=Cq9sc0BvwsnRD63njLowdV5BFR%2Bc7ytsp/3zm1nMx9o%3D"
    steps:
      - uses: actions/checkout@v4

      - name: Fetch locked v1.1.3 source
        run: |
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 "$SOURCE_URL" -o /tmp/clinical-suite-v1.1.3-source.zip
          echo "$SOURCE_SHA256  /tmp/clinical-suite-v1.1.3-source.zip" | sha256sum -c -
          rm -rf /tmp/clinical-suite-v1.1.3
          mkdir -p /tmp/clinical-suite-v1.1.3
          unzip -q /tmp/clinical-suite-v1.1.3-source.zip -d /tmp/clinical-suite-v1.1.3
          PROJECT_DIR=$(find /tmp/clinical-suite-v1.1.3 -mindepth 1 -maxdepth 1 -type d | head -n1)
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify v1.1.3 interaction-deadlock contract
        run: |
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          import json, hashlib, pathlib
          root=pathlib.Path("app/src/main/assets/offline")
          m=json.loads((root/"offline-manifest.json").read_text(encoding="utf-8"))
          assert m["android_version"]=="1.1.3"
          assert m["content_version"]=="16.7.7"
          assert m["tool_count"]==1505
          assert m["file_count"]==52
          assert m["payload_bytes"]==35272615
          assert m["offline_default"] is True
          total=0
          for rec in m["files"]:
              p=root/rec["path"]
              b=p.read_bytes()
              assert len(b)==rec["bytes"], p
              assert hashlib.sha256(b).hexdigest()==rec["sha256"], p
              total+=len(b)
          assert total==m["payload_bytes"]

          java=pathlib.Path("app/src/main/java/com/medipharm/clinicalsuite/MainActivity.java").read_text(encoding="utf-8")
          build=pathlib.Path("app/build.gradle").read_text(encoding="utf-8")
          assert "new MutationObserver(apply).observe(document.body" not in java
          assert "window.setTimeout(apply,250);window.setTimeout(apply,1200)" in java
          assert "infoPanel.dataset.mcsAndroidInfo!==androidVersion" in java
          assert "webView.setClickable(true)" in java
          assert "webView.setFocusableInTouchMode(true)" in java
          assert "versionCode 7" in build
          assert "versionName '1.1.3'" in build
          print(f"V113_LOCK_PASS files={m['file_count']} bytes={total} tools={m['tool_count']}")
          PY
          echo "fa842429c8fe80639c2173f6cef65edff7f5d2c62a3220175dcd13957535fd11  app/src/main/res/drawable/app_icon.png" | sha256sum -c -

      - name: Build and align v1.1.3
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/out"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.1.3-aligned-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.1.3-aligned-unsigned.apk"
          sha256sum "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.1.3-aligned-unsigned.apk" > "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.1.3-aligned-unsigned.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: medipharm-clinical-suite-v1.1.3-deadlock-hotfix-build
          path: out/
          if-no-files-found: error
          retention-days: 7
