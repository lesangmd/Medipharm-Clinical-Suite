name: Build Android v1.2.8 Bottom Dock Insets Fix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SOURCE_SHA256: 5cf9e61db9cadc29f8286755d30e46110a3335123c169f59ac035f1ffa279396
    steps:
      - uses: actions/checkout@v4
      - name: Fetch locked v1.2.8 source
        env:
          SOURCE_URL: "https://sdmntprseasia.oaiusercontent.com/files/00000000-41ac-8207-9e91-12ff5a93cb08/raw?se=2026-10-02T08%3A45%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=faec0f9f-e485-5af1-8271-55f12e7d9ba8&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T02%3A20%3A45Z&ske=2026-10-03T02%3A20%3A45Z&sks=b&skv=2026-02-06&sig=mxpGCUAR368yFM3bl3PRIdzJFiqs4K1fA7Zy3a9Objs%3D"
        run: |
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 "$SOURCE_URL" -o /tmp/clinical-suite-v1.2.8-source.zip
          echo "$SOURCE_SHA256  /tmp/clinical-suite-v1.2.8-source.zip" | sha256sum -c -
          rm -rf /tmp/clinical-suite-v1.2.8
          mkdir -p /tmp/clinical-suite-v1.2.8
          unzip -q /tmp/clinical-suite-v1.2.8-source.zip -d /tmp/clinical-suite-v1.2.8
          PROJECT_DIR=$(find /tmp/clinical-suite-v1.2.8 -mindepth 1 -maxdepth 1 -type d | head -n1)
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify and build v1.2.8
        run: |
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path("app/src/main/assets/offline")
          m=json.loads((root/"offline-manifest.json").read_text(encoding="utf-8"))
          assert m["android_version"]=="1.2.8"
          assert m["content_version"]=="16.7.10"
          assert m["tool_count"]==1505
          build=pathlib.Path("app/build.gradle").read_text(encoding="utf-8")
          java=pathlib.Path("app/src/main/java/com/medipharm/clinicalsuite/MainActivity.java").read_text(encoding="utf-8")
          assert "versionCode 19" in build and "versionName '1.2.8'" in build
          assert "v.setPadding(topInsets.left, topInsets.top, topInsets.right, 0);" in java
          assert "--mcs-android-bottom-inset" in java
          assert "[data-mcs-mobile-more] b{font-size:0!important}" in java
          assert 'b:after{content:"Menu"!important' in java
          print("V128_LOCK_PASS")
          PY
          gradle --no-daemon assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/out"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.2.8-aligned-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.2.8-aligned-unsigned.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: medipharm-clinical-suite-v1.2.8-build
          path: out/
          if-no-files-found: error
          retention-days: 7
