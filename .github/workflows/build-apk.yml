name: Build Android v1.2.3 Single Menu Navigation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SOURCE_SHA256: c1244358f1301e06d8bd69206b96871a31b2f889fb4ae3a927a9977228a8f214
      SOURCE_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-bed0-8209-8744-457fcc4e3371/raw?se=2026-10-02T01%3A11%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=d778a8c3-e166-5eb9-a990-ea1c07e417f9&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T20%3A48%3A05Z&ske=2026-10-02T20%3A48%3A05Z&sks=b&skv=2026-02-06&sig=PiI82rxBGPRt6jz%2BxpFtbJKpombGK0kmQaozlG9FkUk%3D"
    steps:
      - uses: actions/checkout@v4

      - name: Fetch locked v1.2.3 source
        run: |
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 "$SOURCE_URL" -o /tmp/clinical-suite-v1.2.3-source.zip
          echo "$SOURCE_SHA256  /tmp/clinical-suite-v1.2.3-source.zip" | sha256sum -c -
          rm -rf /tmp/clinical-suite-v1.2.3
          mkdir -p /tmp/clinical-suite-v1.2.3
          unzip -q /tmp/clinical-suite-v1.2.3-source.zip -d /tmp/clinical-suite-v1.2.3
          PROJECT_DIR=$(find /tmp/clinical-suite-v1.2.3 -mindepth 1 -maxdepth 1 -type d | head -n1)
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify v1.2.3 contract
        run: |
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          import json, pathlib, hashlib
          root=pathlib.Path("app/src/main/assets/offline")
          m=json.loads((root/"offline-manifest.json").read_text(encoding="utf-8"))
          assert m["android_version"]=="1.2.3"
          assert m["content_version"]=="16.7.10"
          assert m["tool_count"]==1505
          assert m["file_count"]==52
          total=0
          for rec in m["files"]:
              p=root/rec["path"]
              b=p.read_bytes()
              assert len(b)==rec["bytes"], rec["path"]
              assert hashlib.sha256(b).hexdigest()==rec["sha256"], rec["path"]
              total+=len(b)
          assert total==m["payload_bytes"]

          index=(root/"index.html").read_text(encoding="utf-8")
          build=pathlib.Path("app/build.gradle").read_text(encoding="utf-8")
          java=pathlib.Path("app/src/main/java/com/medipharm/clinicalsuite/MainActivity.java").read_text(encoding="utf-8")

          assert '<button aria-label="Menu" class="mcs-v323-menu" data-mcs-desktop-more=""' not in index
          assert 'data-mcs-mobile-more=""' in index
          assert "versionCode 14" in build and "versionName '1.2.3'" in build
          assert "setDecorFitsSystemWindows(false)" in java
          assert "WindowInsets.Type.displayCutout()" in java
          print("V123_LOCK_PASS")
          PY
          node --check app/src/main/assets/offline/assets/js/clinical-ui.js

      - name: Build and align v1.2.3
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/out"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.2.3-aligned-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.2.3-aligned-unsigned.apk"
          sha256sum "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.2.3-aligned-unsigned.apk" > "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.2.3-aligned-unsigned.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: medipharm-clinical-suite-v1.2.3-build
          path: out/
          if-no-files-found: error
          retention-days: 7
