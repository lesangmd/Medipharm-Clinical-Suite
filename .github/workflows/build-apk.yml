name: Build Android v1.1.4 Readability and About Refinement

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Temporary download URL for locked v1.1.4 source ZIP"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SOURCE_SHA256: ea1b569646350880ab26cb04be1b51db21c5769a2edb02795c3d60d5cef02a4c
    steps:
      - uses: actions/checkout@v4

      - name: Fetch locked v1.1.4 source
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 "$SOURCE_URL" -o /tmp/clinical-suite-v1.1.4-source.zip
          echo "$SOURCE_SHA256  /tmp/clinical-suite-v1.1.4-source.zip" | sha256sum -c -
          rm -rf /tmp/clinical-suite-v1.1.4
          mkdir -p /tmp/clinical-suite-v1.1.4
          unzip -q /tmp/clinical-suite-v1.1.4-source.zip -d /tmp/clinical-suite-v1.1.4
          PROJECT_DIR=$(find /tmp/clinical-suite-v1.1.4 -mindepth 1 -maxdepth 1 -type d | head -n1)
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify v1.1.4 contract
        run: |
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          import json, hashlib, pathlib
          root=pathlib.Path("app/src/main/assets/offline")
          m=json.loads((root/"offline-manifest.json").read_text(encoding="utf-8"))
          assert m["android_version"]=="1.1.4"
          assert m["content_version"]=="16.7.7"
          assert m["tool_count"]==1505
          assert m["file_count"]==52
          assert m["payload_bytes"]==35272697
          total=0
          for rec in m["files"]:
              b=(root/rec["path"]).read_bytes()
              assert len(b)==rec["bytes"]
              assert hashlib.sha256(b).hexdigest()==rec["sha256"]
              total+=len(b)
          assert total==m["payload_bytes"]
          java=pathlib.Path("app/src/main/java/com/medipharm/clinicalsuite/MainActivity.java").read_text()
          build=pathlib.Path("app/build.gradle").read_text()
          ui=(root/"assets/js/clinical-ui.js").read_text()
          index=(root/"index.html").read_text()
          assert "s.setTextZoom(90);" in java
          assert "new MutationObserver(apply).observe(document.body" not in java
          assert "Mục đích và Đối tượng áp dụng" in ui
          assert "Dùng thế nào trong thực hành?" not in ui
          assert "<strong>Menu</strong>" in index
          assert "<b>Giới thiệu</b><small>Thông tin ứng dụng</small>" in index
          assert "versionCode 8" in build and "versionName '1.1.4'" in build
          print("V114_LOCK_PASS")
          PY
          node --check app/src/main/assets/offline/assets/js/clinical-ui.js
          echo "fa842429c8fe80639c2173f6cef65edff7f5d2c62a3220175dcd13957535fd11  app/src/main/res/drawable/app_icon.png" | sha256sum -c -

      - name: Build and align v1.1.4
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/out"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.1.4-aligned-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.1.4-aligned-unsigned.apk"
          sha256sum "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.1.4-aligned-unsigned.apk" > "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.1.4-aligned-unsigned.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: medipharm-clinical-suite-v1.1.4-build
          path: out/
          if-no-files-found: error
          retention-days: 7
