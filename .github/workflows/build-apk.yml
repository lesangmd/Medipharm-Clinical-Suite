name: Build Android v1.1.6 System Bar Insets Hotfix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SOURCE_SHA256: dc7892c0f7acdcd5eff3b275ff20a8b3c0fab24713114a3e2e5535935e8d8df0
      SOURCE_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-28a8-8206-ab4e-1f801ab9c0cd/raw?se=2026-10-01T09%3A17%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=2bd24c3d-d3bf-529d-a9ed-704033961866&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T06%3A25%3A53Z&ske=2026-10-02T06%3A25%3A53Z&sks=b&skv=2026-02-06&sig=0rRKZpOMdeSrWJrNGGy5TPNhRMNokYizU3EfzwQey0k%3D"
    steps:
      - uses: actions/checkout@v4

      - name: Fetch locked v1.1.6 source
        run: |
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 "$SOURCE_URL" -o /tmp/clinical-suite-v1.1.6-source.zip
          echo "$SOURCE_SHA256  /tmp/clinical-suite-v1.1.6-source.zip" | sha256sum -c -
          rm -rf /tmp/clinical-suite-v1.1.6
          mkdir -p /tmp/clinical-suite-v1.1.6
          unzip -q /tmp/clinical-suite-v1.1.6-source.zip -d /tmp/clinical-suite-v1.1.6
          PROJECT_DIR=$(find /tmp/clinical-suite-v1.1.6 -mindepth 1 -maxdepth 1 -type d | head -n1)
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify v1.1.6 contract
        run: |
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path("app/src/main/assets/offline")
          m=json.loads((root/"offline-manifest.json").read_text(encoding="utf-8"))
          assert m["android_version"]=="1.1.6"
          assert m["content_version"]=="16.7.7"
          assert m["tool_count"]==1505
          assert m["file_count"]==52

          java=pathlib.Path("app/src/main/java/com/medipharm/clinicalsuite/MainActivity.java").read_text()
          build=pathlib.Path("app/build.gradle").read_text()

          assert "getWindow().setDecorFitsSystemWindows(false);" in java
          assert "setOnApplyWindowInsetsListener" in java
          assert "WindowInsets.Type.statusBars() | WindowInsets.Type.displayCutout()" in java
          assert "WindowInsets.Type.navigationBars()" in java
          assert "root.requestApplyInsets();" in java
          assert "versionCode 10" in build and "versionName '1.1.6'" in build

          print("V116_LOCK_PASS")
          PY

      - name: Build and align v1.1.6
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/out"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.1.6-aligned-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.1.6-aligned-unsigned.apk"
          sha256sum "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.1.6-aligned-unsigned.apk" > "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.1.6-aligned-unsigned.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: medipharm-clinical-suite-v1.1.6-build
          path: out/
          if-no-files-found: error
          retention-days: 7
