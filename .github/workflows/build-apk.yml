name: Build Android v1.1.0 Offline

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Temporary download URL for the locked v1.1.0 source ZIP"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SOURCE_SHA256: ae29b4c8c3e66e924349739646b22f216e1a0a32c83d54eacafb02e865641d8f
    steps:
      - uses: actions/checkout@v4

      - name: Fetch locked v1.1.0 source
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 "$SOURCE_URL" -o /tmp/clinical-suite-v1.1.0-source.zip
          echo "$SOURCE_SHA256  /tmp/clinical-suite-v1.1.0-source.zip" | sha256sum -c -
          rm -rf /tmp/clinical-suite-v1.1.0
          mkdir -p /tmp/clinical-suite-v1.1.0
          unzip -q /tmp/clinical-suite-v1.1.0-source.zip -d /tmp/clinical-suite-v1.1.0
          PROJECT_DIR=$(find /tmp/clinical-suite-v1.1.0 -mindepth 1 -maxdepth 1 -type d | head -n1)
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify locked offline payload
        run: |
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          import json, hashlib, pathlib
          root=pathlib.Path("app/src/main/assets/offline")
          m=json.loads((root/"offline-manifest.json").read_text(encoding="utf-8"))
          assert m["android_version"]=="1.1.0"
          assert m["content_version"]=="16.7.7"
          assert m["tool_count"]==1505
          assert m["file_count"]==52
          assert m["payload_bytes"]==28244140
          assert m["offline_default"] is True
          total=0
          for rec in m["files"]:
              p=root/rec["path"]
              b=p.read_bytes()
              assert len(b)==rec["bytes"], p
              assert hashlib.sha256(b).hexdigest()==rec["sha256"], p
              total+=len(b)
          assert total==m["payload_bytes"]
          print(f"OFFLINE_LOCK_PASS files={m['file_count']} bytes={total} tools={m['tool_count']}")
          PY
          echo "fa842429c8fe80639c2173f6cef65edff7f5d2c62a3220175dcd13957535fd11  app/src/main/res/drawable/app_icon.png" | sha256sum -c -

      - name: Build and align
        run: |
          cd "$PROJECT_DIR"
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n1)
          VERSION_CODE=$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" app/build.gradle | head -n1)
          test "$VERSION_NAME" = "1.1.0"
          test "$VERSION_CODE" = "4"
          gradle --no-daemon assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/out"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.1.0-aligned-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.1.0-aligned-unsigned.apk"
          sha256sum "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.1.0-aligned-unsigned.apk" > "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.1.0-aligned-unsigned.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: medipharm-clinical-suite-v1.1.0-offline-build
          path: out/
          if-no-files-found: error
          retention-days: 7
