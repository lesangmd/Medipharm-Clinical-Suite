name: Publish Android v1.1.0 Production

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch locked production artifacts
        env:
          APK_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-00a4-8206-9d38-e0410836c24f/raw?se=2026-09-29T09%3A18%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=c6398fd3-17d2-5d64-9c59-101fc1412323&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T04%3A00%3A39Z&ske=2026-09-30T04%3A00%3A39Z&sks=b&skv=2026-02-06&sig=xXW0XfDCCcdG2lVd5o9iR9LvUI%2BV5wtj7ydHiiodUmM%3D"
          SOURCE_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-f718-8209-8588-7e7df240fb39/raw?se=2026-09-29T09%3A14%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=4f6ba531-9e12-57cf-871f-f9bf2b558950&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T03%3A58%3A20Z&ske=2026-09-30T03%3A58%3A20Z&sks=b&skv=2026-02-06&sig=dBMdqOuZ7aDWLPPiNa1CNYMmtZItWqvoJ5VqvKICNPU%3D"
          APK_SHA256: "3015858b4781eab363631dda63c75f6416f1f2ce26e9392973ea4972ba71629c"
          SOURCE_SHA256: "ae29b4c8c3e66e924349739646b22f216e1a0a32c83d54eacafb02e865641d8f"
        run: |
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 "$APK_URL" -o MEDIPHARM-Clinical-Suite-v1.1.0.apk
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 "$SOURCE_URL" -o MEDIPHARM-Clinical-Suite-Android-v1.1.0-Offline-source.zip
          echo "$APK_SHA256  MEDIPHARM-Clinical-Suite-v1.1.0.apk" | sha256sum -c -
          echo "$SOURCE_SHA256  MEDIPHARM-Clinical-Suite-Android-v1.1.0-Offline-source.zip" | sha256sum -c -
          echo "$APK_SHA256  MEDIPHARM-Clinical-Suite-v1.1.0.apk" > MEDIPHARM-Clinical-Suite-v1.1.0.apk.sha256
          echo "$SOURCE_SHA256  MEDIPHARM-Clinical-Suite-Android-v1.1.0-Offline-source.zip" > MEDIPHARM-Clinical-Suite-Android-v1.1.0-Offline-source.zip.sha256
          cat > RELEASE-v1.1.0.md <<'EOF'
          # MEDIPHARM Clinical Suite Android v1.1.0 — Offline-First Core

          Production Android release.

          - Android version: 1.1.0 (versionCode 4)
          - Package: com.medipharm.clinicalsuite
          - Offline WebApp content: MEDIPHARM Clinical Suite v16.7.7
          - Offline catalog: 1,505 clinical tools
          - Offline payload: 52 locked files, 28,244,140 bytes
          - Default runtime: local APK assets via appassets.androidplatform.net
          - Network is required only for MEDIPHARM account authentication, Android update checks, and user-opened external references.
          - Release APK is signed with the established Clinical Suite release certificate used by v1.0.x.
          - APK SHA-256: 3015858b4781eab363631dda63c75f6416f1f2ce26e9392973ea4972ba71629c
          - Source ZIP SHA-256: ae29b4c8c3e66e924349739646b22f216e1a0a32c83d54eacafb02e865641d8f
          EOF

      - name: Publish production artifacts to repository root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MEDIPHARM-Clinical-Suite-v1.1.0.apk \
                  MEDIPHARM-Clinical-Suite-v1.1.0.apk.sha256 \
                  MEDIPHARM-Clinical-Suite-Android-v1.1.0-Offline-source.zip \
                  MEDIPHARM-Clinical-Suite-Android-v1.1.0-Offline-source.zip.sha256 \
                  RELEASE-v1.1.0.md
          git commit -m "Release Android v1.1.0 Offline-First Core"
          git push origin HEAD:main
