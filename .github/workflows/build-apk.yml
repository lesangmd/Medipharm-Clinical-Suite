name: Build Android v1.2.6 Adaptive Icon Fix

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Temporary download URL for locked v1.2.6 source ZIP"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SOURCE_SHA256: d0fb2128e89122daf8fe48e6b425b0d9c51bdbc361cb36b8c9d6b05ae3d01922
    steps:
      - uses: actions/checkout@v4
      - name: Fetch locked v1.2.6 source
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 "$SOURCE_URL" -o /tmp/clinical-suite-v1.2.6-source.zip
          echo "$SOURCE_SHA256  /tmp/clinical-suite-v1.2.6-source.zip" | sha256sum -c -
          rm -rf /tmp/clinical-suite-v1.2.6
          mkdir -p /tmp/clinical-suite-v1.2.6
          unzip -q /tmp/clinical-suite-v1.2.6-source.zip -d /tmp/clinical-suite-v1.2.6
          PROJECT_DIR=$(find /tmp/clinical-suite-v1.2.6 -mindepth 1 -maxdepth 1 -type d | head -n1)
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify and build v1.2.6
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/out"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.2.6-aligned-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.2.6-aligned-unsigned.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: medipharm-clinical-suite-v1.2.6-build
          path: out/
          if-no-files-found: error
          retention-days: 7
