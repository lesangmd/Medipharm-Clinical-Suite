name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore canonical WebApp launcher icon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXPECTED_ICON_SHA="fa842429c8fe80639c2173f6cef65edff7f5d2c62a3220175dcd13957535fd11"
          ARTIFACT_URL="https://api.github.com/repos/lesangmd/Medipharm-Clinical-Suite/actions/artifacts/11014754337/zip"
          curl -fL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$ARTIFACT_URL" -o /tmp/v101-artifact.zip
          rm -rf /tmp/v101-artifact /tmp/v101-apk
          mkdir -p /tmp/v101-artifact /tmp/v101-apk
          unzip -q /tmp/v101-artifact.zip -d /tmp/v101-artifact
          V101_APK=$(find /tmp/v101-artifact -maxdepth 1 -type f -name '*.apk' | head -n1)
          test -n "$V101_APK"
          unzip -q "$V101_APK" -d /tmp/v101-apk
          ICON_PATH=$(find /tmp/v101-apk/res -type f -name '*.png' -print0 | xargs -0 sha256sum | awk -v s="$EXPECTED_ICON_SHA" '$1==s{print $2; exit}')
          test -n "$ICON_PATH"
          rm -f app/src/main/res/drawable/app_icon.xml app/src/main/res/drawable/app_icon.webp app/src/main/res/drawable/app_icon.png
          cp "$ICON_PATH" app/src/main/res/drawable/app_icon.png
          echo "$EXPECTED_ICON_SHA  app/src/main/res/drawable/app_icon.png" | sha256sum -c -

      - name: Persist canonical launcher icon in repository
        run: |
          if ! git diff --quiet -- app/src/main/res/drawable; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/res/drawable
            git commit -m "Android: embed canonical WebApp launcher icon"
            git push origin HEAD:main
          fi

      - name: Build and align release APK
        run: |
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n1)
          test -n "$VERSION_NAME"
          gradle --no-daemon assembleRelease
          mkdir -p out
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "out/MEDIPHARM-Clinical-Suite-v${VERSION_NAME}-aligned-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "out/MEDIPHARM-Clinical-Suite-v${VERSION_NAME}-aligned-unsigned.apk"
          sha256sum "out/MEDIPHARM-Clinical-Suite-v${VERSION_NAME}-aligned-unsigned.apk" > "out/MEDIPHARM-Clinical-Suite-v${VERSION_NAME}-aligned-unsigned.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: medipharm-clinical-suite-android-build
          path: out/
          if-no-files-found: error
          retention-days: 7
