name: Build Android v1.2.6 Adaptive Icon Fix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SOURCE_SHA256: fb36929f76ca9fa5512243ec16553f74cc4c7b166d9b8fd5a26f219782540f3d
      SOURCE_URL: "https://sdmntprnznorth.oaiusercontent.com/files/00000000-e5d0-820b-9348-5d93890c9f4f/raw?se=2026-10-02T13%3A28%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=02e58cbc-87ce-5b14-ac93-1c1d27ee3f1c&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T02%3A50%3A25Z&ske=2026-10-03T02%3A50%3A25Z&sks=b&skv=2026-02-06&sig=ZwxP6nOi2vZkdP8RN2o6EQJACPMXEc7vWhdPLOFZhf8%3D"
    steps:
      - uses: actions/checkout@v4

      - name: Fetch locked v1.2.6 source
        run: |
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 "$SOURCE_URL" -o /tmp/clinical-suite-v1.2.6-source.zip
          echo "$SOURCE_SHA256  /tmp/clinical-suite-v1.2.6-source.zip" | sha256sum -c -
          rm -rf /tmp/clinical-suite-v1.2.6
          mkdir -p /tmp/clinical-suite-v1.2.6
          unzip -q /tmp/clinical-suite-v1.2.6-source.zip -d /tmp/clinical-suite-v1.2.6
          PROJECT_DIR=$(find /tmp/clinical-suite-v1.2.6 -mindepth 1 -maxdepth 1 -type d | head -n1)
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify v1.2.6 adaptive icon contract
        run: |
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path(".")
          m=json.loads((root/"app/src/main/assets/offline/offline-manifest.json").read_text(encoding="utf-8"))
          build=(root/"app/build.gradle").read_text(encoding="utf-8")
          manifest=(root/"app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")
          adaptive=(root/"app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml").read_text(encoding="utf-8")
          round_adaptive=(root/"app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml").read_text(encoding="utf-8")
          assert m["android_version"]=="1.2.6"
          assert m["content_version"]=="16.7.10"
          assert m["tool_count"]==1505
          assert m["file_count"]==52
          assert "versionCode 17" in build and "versionName '1.2.6'" in build
          assert 'android:icon="@mipmap/ic_launcher"' in manifest
          assert 'android:roundIcon="@mipmap/ic_launcher_round"' in manifest
          assert "<adaptive-icon" in adaptive and "@color/ic_launcher_background" in adaptive
          assert "@drawable/ic_launcher_foreground" in adaptive
          assert adaptive==round_adaptive
          assert (root/"app/src/main/res/drawable-nodpi/ic_launcher_foreground_bitmap.png").is_file()
          assert (root/"app/src/main/res/mipmap-xxxhdpi/ic_launcher.png").is_file()
          assert (root/"app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png").is_file()
          print("V126_ADAPTIVE_ICON_PASS")
          PY

      - name: Build and align v1.2.6
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/out"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.2.6-aligned-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.2.6-aligned-unsigned.apk"
          sha256sum "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.2.6-aligned-unsigned.apk" > "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.2.6-aligned-unsigned.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: medipharm-clinical-suite-v1.2.6-adaptive-icon-build
          path: out/
          if-no-files-found: error
          retention-days: 7
