name: Build Android v1.2.2 Visual Refinement RC

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SOURCE_SHA256: 13c08cd8ff08ed3b2092edc42501d6995fc64134ff346d4f65a54e8abe009f9d
      SOURCE_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-6330-8209-8836-0c35fc62cc5a/raw?se=2026-10-02T00%3A57%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=e0666ec3-4561-50ba-93a0-f05cbe305415&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T23%3A33%3A58Z&ske=2026-10-02T23%3A33%3A58Z&sks=b&skv=2026-02-06&sig=HgTKDtUSUmMZN2gj1mGzCTfSs%2B99v/LtcymBTm2yHsQ%3D"
    steps:
      - uses: actions/checkout@v4

      - name: Fetch locked v1.2.2 source
        run: |
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 "$SOURCE_URL" -o /tmp/clinical-suite-v1.2.2-source.zip
          echo "$SOURCE_SHA256  /tmp/clinical-suite-v1.2.2-source.zip" | sha256sum -c -
          rm -rf /tmp/clinical-suite-v1.2.2
          mkdir -p /tmp/clinical-suite-v1.2.2
          unzip -q /tmp/clinical-suite-v1.2.2-source.zip -d /tmp/clinical-suite-v1.2.2
          PROJECT_DIR=$(find /tmp/clinical-suite-v1.2.2 -mindepth 1 -maxdepth 1 -type d | head -n1)
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify v1.2.2 contract
        run: |
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          import json, pathlib, hashlib
          root=pathlib.Path("app/src/main/assets/offline")
          m=json.loads((root/"offline-manifest.json").read_text())
          assert m["android_version"]=="1.2.2"
          assert m["content_version"]=="16.7.10"
          assert m["tool_count"]==1505 and m["file_count"]==52
          total=0
          for rec in m["files"]:
              p=root/rec["path"]; b=p.read_bytes(); total+=len(b)
              assert len(b)==rec["bytes"]
              assert hashlib.sha256(b).hexdigest()==rec["sha256"]
          assert total==m["payload_bytes"]
          build=pathlib.Path("app/build.gradle").read_text()
          java=pathlib.Path("app/src/main/java/com/medipharm/clinicalsuite/MainActivity.java").read_text()
          css=(root/"assets/css/app.css").read_text()
          ui=(root/"assets/js/clinical-ui.js").read_text()
          idx=(root/"index.html").read_text()
          assert "versionCode 13" in build and "versionName '1.2.2'" in build
          assert "mcs-home-ia-v16710" in ui and "mcs-home-ia-v16710" in idx
          assert "v16.7.10 — Visual Refinement" in css
          assert "linear-gradient(90deg,#e7f7f2" in css
          assert ".mcs-home-emergency{background:linear-gradient(90deg" in css
          assert "s.setTextZoom(100);" in java
          assert "WindowInsets.Type.statusBars() | WindowInsets.Type.displayCutout()" in java
          assert "WindowInsets.Type.navigationBars()" in java
          print("V122_LOCK_PASS")
          PY
          node --check app/src/main/assets/offline/assets/js/clinical-ui.js

      - name: Build and align v1.2.2
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/out"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.2.2-aligned-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.2.2-aligned-unsigned.apk"
          sha256sum "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.2.2-aligned-unsigned.apk" > "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.2.2-aligned-unsigned.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: medipharm-clinical-suite-v1.2.2-build
          path: out/
          if-no-files-found: error
          retention-days: 7
