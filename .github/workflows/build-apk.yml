name: Build Android v1.2.1 Hero Layout Refinement

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SOURCE_SHA256: e3ea37e73578edb034a1a1c3a8bf8d5e44c0d09ff892d1fe57acb62182dc93ad
      SOURCE_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-0678-8209-8af3-ea77ad323da5/raw?se=2026-10-02T00%3A37%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=1ce7cc22-9cf7-53c0-80b2-0138f9295fad&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T23%3A20%3A29Z&ske=2026-10-02T23%3A20%3A29Z&sks=b&skv=2026-02-06&sig=FY0E1pYeOb4ehf6giOMZk8ypTJHm9/yxTGOQpZqegC8%3D"
    steps:
      - uses: actions/checkout@v4

      - name: Fetch locked v1.2.1 source
        run: |
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 "$SOURCE_URL" -o /tmp/clinical-suite-v1.2.1-source.zip
          echo "$SOURCE_SHA256  /tmp/clinical-suite-v1.2.1-source.zip" | sha256sum -c -
          rm -rf /tmp/clinical-suite-v1.2.1
          mkdir -p /tmp/clinical-suite-v1.2.1
          unzip -q /tmp/clinical-suite-v1.2.1-source.zip -d /tmp/clinical-suite-v1.2.1
          PROJECT_DIR=$(find /tmp/clinical-suite-v1.2.1 -mindepth 1 -maxdepth 1 -type d | head -n1)
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify v1.2.1 contract
        run: |
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          import json, pathlib, hashlib
          root=pathlib.Path("app/src/main/assets/offline")
          m=json.loads((root/"offline-manifest.json").read_text(encoding="utf-8"))
          assert m["android_version"]=="1.2.1"
          assert m["content_version"]=="16.7.9"
          assert m["tool_count"]==1505
          assert m["file_count"]==52

          total=0
          for rec in m["files"]:
              b=(root/rec["path"]).read_bytes()
              assert len(b)==rec["bytes"]
              assert hashlib.sha256(b).hexdigest()==rec["sha256"]
              total += len(b)
          assert total==m["payload_bytes"]

          java=pathlib.Path("app/src/main/java/com/medipharm/clinicalsuite/MainActivity.java").read_text()
          build=pathlib.Path("app/build.gradle").read_text()
          idx=(root/"index.html").read_text()
          css=(root/"assets/css/app.css").read_text()
          ui=(root/"assets/js/clinical-ui.js").read_text()

          assert "versionCode 12" in build and "versionName '1.2.1'" in build
          assert "mcs-home-ia-v1679" in idx and "mcs-home-ia-v1679" in ui
          assert "/* v16.7.9 — Hero Layout Refinement */" in css
          assert "grid-template-columns:repeat(2,minmax(0,1fr))" in css
          for k in ["kpi-0","kpi-1","kpi-2","kpi-3"]:
              assert k in css
          assert "setDecorFitsSystemWindows(false)" in java
          assert "WindowInsets.Type.displayCutout()" in java
          assert "WindowInsets.Type.navigationBars()" in java
          print("V121_LOCK_PASS")
          PY
          node --check app/src/main/assets/offline/assets/js/clinical-ui.js

      - name: Build and align v1.2.1
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/out"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.2.1-aligned-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.2.1-aligned-unsigned.apk"
          sha256sum "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.2.1-aligned-unsigned.apk" > "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.2.1-aligned-unsigned.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: medipharm-clinical-suite-v1.2.1-build
          path: out/
          if-no-files-found: error
          retention-days: 7
