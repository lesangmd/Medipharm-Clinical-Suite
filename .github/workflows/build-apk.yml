name: Build Android v1.1.5 Remove Website Home

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SOURCE_SHA256: e68d271c4a68f27b587b4d3d31ae97c4261543cdf7f8767a3e2d3782962d263b
      SOURCE_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-4328-8209-bc9d-66b796deeca0/raw?se=2026-09-30T04%3A17%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=3d7fc50b-dfe5-57be-a67d-89d35ca7bba4&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T23%3A25%3A21Z&ske=2026-09-30T23%3A25%3A21Z&sks=b&skv=2026-02-06&sig=Jym9/JnUjIolVm4KJHgwu%2BYOeYAuPA1i9ro6CtBdFs8%3D"
    steps:
      - uses: actions/checkout@v4

      - name: Fetch locked v1.1.5 source
        run: |
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 "$SOURCE_URL" -o /tmp/clinical-suite-v1.1.5-source.zip
          echo "$SOURCE_SHA256  /tmp/clinical-suite-v1.1.5-source.zip" | sha256sum -c -
          rm -rf /tmp/clinical-suite-v1.1.5
          mkdir -p /tmp/clinical-suite-v1.1.5
          unzip -q /tmp/clinical-suite-v1.1.5-source.zip -d /tmp/clinical-suite-v1.1.5
          PROJECT_DIR=$(find /tmp/clinical-suite-v1.1.5 -mindepth 1 -maxdepth 1 -type d | head -n1)
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify v1.1.5 contract
        run: |
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path("app/src/main/assets/offline")
          m=json.loads((root/"offline-manifest.json").read_text(encoding="utf-8"))
          assert m["android_version"]=="1.1.5"
          assert m["content_version"]=="16.7.7"
          assert m["tool_count"]==1505
          assert m["file_count"]==52
          java=pathlib.Path("app/src/main/java/com/medipharm/clinicalsuite/MainActivity.java").read_text()
          build=pathlib.Path("app/build.gradle").read_text()
          assert "label.indexOf('về trang chủ')===0" in java
          assert "u.hostname==='www.sachyhoc.com'" not in java
          assert "versionCode 9" in build and "versionName '1.1.5'" in build
          print("V115_LOCK_PASS")
          PY

      - name: Build and align v1.1.5
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/out"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.1.5-aligned-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.1.5-aligned-unsigned.apk"
          sha256sum "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.1.5-aligned-unsigned.apk" > "$GITHUB_WORKSPACE/out/MEDIPHARM-Clinical-Suite-v1.1.5-aligned-unsigned.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: medipharm-clinical-suite-v1.1.5-build
          path: out/
          if-no-files-found: error
          retention-days: 7
