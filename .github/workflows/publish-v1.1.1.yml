name: Publish signed Android v1.1.1

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v1.1.1.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify signed APK
        env:
          APK_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-41c0-8209-b0a2-d2a6e1e70d7b/raw?se=2026-09-29T12%3A17%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=e987f61c-acda-5d3a-bc2c-fd1ae787cc4f&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T03%3A48%3A29Z&ske=2026-09-30T03%3A48%3A29Z&sks=b&skv=2026-02-06&sig=QfLF4CB4IZXQ4BeT2yfn308e2%2B%2BdsS3Q2qDdS0fQ%2BaE%3D"
          APK_SHA256: "053969be89500fb4f44f7928f133c25ea62c36abf8045cca085ad056d00e5dc4"
        run: |
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 "$APK_URL" -o MEDIPHARM-Clinical-Suite-v1.1.1.apk
          echo "$APK_SHA256  MEDIPHARM-Clinical-Suite-v1.1.1.apk" | sha256sum -c -
          echo "$APK_SHA256  MEDIPHARM-Clinical-Suite-v1.1.1.apk" > MEDIPHARM-Clinical-Suite-v1.1.1.apk.sha256

      - name: Write release record
        run: |
          cat > RELEASE-v1.1.1.md <<'EOF'
          # MEDIPHARM Clinical Suite Android v1.1.1

          Offline bootstrap hotfix superseding Android v1.1.0.

          - Replaces custom WebView asset interception with AndroidX WebViewAssetLoader.
          - Removes redundant catalog preload.
          - Adds visible bootstrap failure recovery and retry.
          - Keeps Clinical Suite content v16.7.7 with 1,505 tools.
          - Keeps package com.medipharm.clinicalsuite and the established release signing lineage.

          APK SHA-256: 053969be89500fb4f44f7928f133c25ea62c36abf8045cca085ad056d00e5dc4
          EOF

      - name: Commit production artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MEDIPHARM-Clinical-Suite-v1.1.1.apk MEDIPHARM-Clinical-Suite-v1.1.1.apk.sha256 RELEASE-v1.1.1.md
          git commit -m "Publish Android v1.1.1 offline bootstrap hotfix"
          git push origin HEAD:main
